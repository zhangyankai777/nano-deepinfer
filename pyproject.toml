[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-deepinfer"
version = "0.1.0"
description = "A minimal, readable re-implementation of DeepSeek DeepInfer's core inference path"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "safetensors",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["nanodeepinfer*"]
